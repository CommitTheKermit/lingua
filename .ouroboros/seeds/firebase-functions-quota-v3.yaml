goal: "Firebase translateProxy가 익명 사용자별 회복형 quota와 월간 전체 예산을 동시 요청과 실패에서도 정확하게 집계하도록 완성한다."

constraints:
  - "현재 저장소의 functions 디렉터리를 실행 cwd와 경로 기준으로 사용한다."
  - "검증은 cwd를 바꾸지 않은 단독 npm test만 tests_passed 증거로 사용한다."
  - "Ouroboros가 만든 ooo/<session> 관리 브랜치에서 다른 브랜치를 만들거나 전환하지 않고, 각 실행 슬라이스를 별도 커밋한다."
  - "Node 20과 현재 package-lock.json의 기존 의존성을 사용하고 새 패키지를 추가하지 않는다."
  - "translateProxy는 asia-northeast3에서 동작하고 클라이언트로부터 DeepL 키를 받지 않는다."
  - "Firebase 익명 UID와 App Check를 검증하고 비익명 인증 요청을 거부한다."
  - "캐시 적중은 네트워크 호출과 quota 차감 없이 반환한다."
  - "개인 quota는 최대 200회이며 2분마다 3회 회복하고 성공한 번역당 1회 차감한다."
  - "전역 quota는 UTC 달력 월 기준 100000회이며 성공한 DeepL 번역만 집계한다."
  - "개인 quota와 전역 quota를 호출 전 예약하고 실패 시 복구하며 동시 요청과 중복 요청에서 제한 초과와 이중 차감을 막는다."
  - "비밀값은 Functions secret과 환경변수로만 다루고 코드, 테스트, 로그와 문서에 평문으로 넣지 않는다."
  - "운영 Firebase 배포와 비밀값 변경은 이번 자동 실행에서 제외하고 별도 운영 검증으로 남긴다."
  - "단일 구현용 인터페이스, 팩토리와 미래 확장용 계층은 만들지 않는다."

acceptance_criteria:
  - description: "translateProxy가 익명 UID와 App Check를 검증하고 캐시 적중을 무료로 반환하며 성공 건만 개인 200회 quota와 UTC 월간 100000회 예산에 반영하고 실패, 동시 요청과 중복 요청에서도 예약과 복구를 정확히 처리한다."
    verify: "npm test"
    artifacts: "NONE"
    expect: "NONE"

