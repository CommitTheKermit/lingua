goal: "Flutter 기반 Lingua 영한 리더를 로그인 없는 Android와 iOS Compose Multiplatform 앱으로 완전히 전환하고, 오프라인 사전과 로컬 읽기 기능 및 Firebase 익명 번역 quota를 제공한다."

constraints:
  - "Flutter 소스는 이 저장소 작업 트리에 없으며 legacy/flutter 브랜치에 보존하고 활성 빌드, 테스트, 배포 대상에서는 제외한다."
  - "현재 chore/prepare-ooo-run 브랜치의 e89fafb까지 구현된 리더, 사전과 익명 번역 기반을 재사용한다."
  - "Android applicationId는 기존 출시 앱과 같은 com.friendshipHyun을 유지한다."
  - "Android의 기존 Flutter 로컬 데이터는 이전하지 않고 강제로 삭제하지도 않는다."
  - "iOS는 com.ao.lingua Bundle ID의 새 앱으로 등록하며 기존 com.example.lingua 앱을 변경하거나 승계하지 않는다."
  - "Android와 iOS의 UI, 화면 상태, 문장 처리, 검색, CSV 생성과 저장 계약은 common KMP 코드로 공유한다."
  - "지원 문서는 TXT 한 종류이며 마지막으로 연 단일 문서를 앱 저장소에 복사하고 콘텐츠 기반 ID로 자동 재개한다."
  - "문장 위치, 검색 결과, 이동, 북마크는 모두 문장 인덱스를 기준으로 한다."
  - "사용자 데이터는 쓰기 가능한 reader.db에 저장하고 번들 사전 SQLite는 읽기 전용으로 분리한다."
  - "SQLite 접근은 androidx.sqlite KMP와 BundledSQLiteDriver를 사용한다."
  - "로그인, 회원가입, 계정 복구, 이메일 인증, 클라우드 단어장과 사용자 데이터 동기화 기능을 포함하지 않는다."
  - "Firebase 익명 인증은 원격 번역이 처음 필요할 때 조용히 수행하며 오프라인 리더와 사전은 인증이나 네트워크 없이 동작한다."
  - "앱은 DeepL 키를 저장하거나 전달받지 않고 asia-northeast3의 translateProxy만 호출한다."
  - "캐시된 기계 번역은 네트워크 호출과 quota 차감 없이 재사용한다."
  - "개인 quota는 최대 200회, 2분마다 3회 회복, 성공한 번역당 1회 차감으로 유지한다."
  - "전역 quota는 UTC 달력 월 기준 100000회이며 성공한 DeepL 번역만 집계한다."
  - "개인 quota와 전역 quota는 호출 전 예약하고 실패 시 복구하며 동시 요청과 중복 요청에서 제한을 초과하거나 이중 차감하지 않는다."
  - "현재 운영 Functions의 App Check 강제를 끄지 않고 CMP 클라이언트의 유효 토큰을 먼저 검증한다."
  - "Android release는 Play Integrity, iOS release는 App Attest와 필요한 DeviceCheck 대체 경로, 개발 빌드는 Debug Provider를 사용한다."
  - "Firebase 운영 프로젝트 lingua-af9c2의 iOS 앱 등록, 익명 인증, App Check, Functions와 Firestore 규칙 반영을 완료 범위에 포함한다."
  - "App Store와 Google Play 업로드는 완료 범위에서 제외한다."
  - "한국어 위키낱말사전 파생 DB와 배포물에 CC BY-SA 4.0 출처와 NOTICE를 포함한다."
  - "Flutter ReadScreen과 ApiUtil의 단일 책임 및 의존성 역전 위반, 전역 가변 상태와 렌더링 중 데이터 변경 구조를 이식하지 않는다."
  - "단일 구현용 인터페이스, 팩토리와 미래 확장용 계층은 만들지 않는다."
  - "KMP 검증은 저장소 루트를 cwd로 둔 단독 ./gradlew test만 tests_passed 증거로 사용한다."
  - "Functions 검증은 functions를 cwd로 둔 단독 npm test만 tests_passed 증거로 사용한다."
  - "빌드, 기기 실행과 운영 Firebase 확인은 테스트 명령에 결합하지 않고 별도 실행 증거로 남긴다."
  - "Ouroboros가 만든 ooo/<session> 관리 브랜치를 이번 작업의 새 브랜치로 간주하고 다른 브랜치를 만들거나 전환하지 않으며, 각 실행 슬라이스를 그 관리 브랜치에 별도 커밋한다."

acceptance_criteria:
  - description: "TXT를 열면 문장이 안정적으로 분리되고 문장 이동, 자동 재개, 문서 검색, 전체 문장 스크롤 뷰어, 북마크, 사용자 번역 자동 저장, 표시 설정과 CSV 내보내기가 Android와 iOS에서 같은 문장 인덱스 계약으로 동작한다."
    verify: "./gradlew test"
    artifacts: "NONE"
    expect: "NONE"

  - description: "단어 버튼과 직접 검색 모달이 동일한 읽기 전용 위키낱말사전 SQLite를 조회하고, 비행기 모드에서도 결과와 라이선스 고지를 제공하며 결과가 없을 때만 사용자가 DeepL 번역을 선택할 수 있다."
    verify: "./gradlew test"
    artifacts: "NONE"
    expect: "NONE"

  - description: "translateProxy가 익명 UID와 App Check를 검증하고 캐시 적중은 무료로 반환하며, 성공 건만 개인 200회 quota와 월 100000회 예산에 반영하고 실패, 동시 요청과 중복 요청에서도 quota가 정확히 보존된다."
    verify: "npm test"
    artifacts: "NONE"
    expect: "NONE"

  - description: "Android com.friendshipHyun 업데이트 빌드가 실기기에서 로그인 화면 없이 시작되고, 하단의 기존 번역 제한 잔량과 충전 시간을 표시하며 오프라인 읽기부터 운영 Firebase 번역까지 동작한다."
    verify: "./gradlew test"
    artifacts: "NONE"
    expect: "NONE"

  - description: "iOS com.ao.lingua 새 앱이 시뮬레이터에서 빌드되고 Android와 같은 CMP 리더, 공통 모달, 드로어, 로컬 DB 설치와 파일 선택 흐름을 제공한다."
    verify: "./gradlew test"
    artifacts: "NONE"
    expect: "NONE"

ontology_schema:
  name: "LinguaMultiplatformReader"
  description: "공유 리더 상태, 로컬 데이터, 오프라인 사전, 익명 번역 quota와 플랫폼 배포 구성을 나타내는 도메인 모델"
  fields:
    - name: "document"
      type: "object"
      description: "콘텐츠 기반 ID, 제목, 앱 내부 복사본과 마지막 접근 정보를 가진 단일 TXT 문서"
    - name: "sentences"
      type: "array"
      description: "안정적인 문장 인덱스와 원문을 가진 문장 목록"
    - name: "reader_state"
      type: "object"
      description: "현재 문장 인덱스, 검색, 뷰어와 자동 재개 상태"
    - name: "translations"
      type: "array"
      description: "문장별 캐시된 기계 번역과 자동 저장된 사용자 번역"
    - name: "bookmarks"
      type: "array"
      description: "문서 ID와 문장 인덱스로 식별되는 북마크"
    - name: "display_settings"
      type: "object"
      description: "원문, 기계 번역, 사용자 번역과 뷰어 각각의 글꼴, 크기, 줄 높이, 글자색과 배경색"
    - name: "dictionary_entries"
      type: "array"
      description: "정규화된 조회 키, 영어 표제어와 한국어 풀이를 가진 읽기 전용 사전 결과"
    - name: "quota_state"
      type: "object"
      description: "익명 UID, 개인 잔량, 회복 기준, 월간 전체 예산과 요청 예약 상태"
    - name: "platform_configuration"
      type: "object"
      description: "Android와 iOS 식별자, Firebase 앱, App Check 공급자와 배포 상태"

evaluation_principles:
  - name: "feature_completeness"
    description: "합의한 Flutter 리더 기능이 로그인 기능을 제외하고 CMP에 빠짐없이 존재한다."
    weight: 1.0
  - name: "data_safety"
    description: "자동 저장, DB 트랜잭션과 업데이트 과정에서 사용자 데이터가 손실되거나 잘못 연결되지 않는다."
    weight: 1.0
  - name: "quota_security"
    description: "비밀값, App Check, 익명 인증, 개인 quota와 전역 예산이 우회 또는 이중 차감되지 않는다."
    weight: 1.0
  - name: "cross_platform_consistency"
    description: "Android와 iOS가 동일한 공통 상태와 사용자 흐름을 제공한다."
    weight: 0.9
  - name: "maintainability"
    description: "Flutter의 객체지향 위반을 반복하지 않으면서 불필요한 추상화를 추가하지 않는다."
    weight: 0.8
  - name: "offline_and_licensing"
    description: "오프라인 사전이 네트워크 없이 작동하고 파생 데이터 라이선스가 정확히 고지된다."
    weight: 0.8

exit_conditions:
  - name: "all_outcomes_verified"
    description: "다섯 acceptance criterion이 모두 충족된다."
    criteria: "5개 criterion 모두 검증 통과"
