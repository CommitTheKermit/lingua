    - name: "local_databases"
      type: "object"
      description: "쓰기 가능한 reader.db와 읽기 전용 사전 SQLite"
    - name: "translation_client"
      type: "object"
      description: "익명 인증, App Check, 캐시와 quota 화면 상태"
    - name: "platform_configuration"
