goal: "Flutter 기반 Lingua 영한 리더를 로그인 없는 Android와 iOS Compose Multiplatform 앱으로 완전히 전환하고, 오프라인 사전과 Firebase 익명 번역 클라이언트를 제공한다."

constraints:
  - "저장소 루트를 실행 cwd와 KMP 프로젝트 경로 기준으로 사용한다."
  - "검증은 cwd를 바꾸지 않은 단독 ./gradlew test만 tests_passed 증거로 사용한다."
  - "Ouroboros가 만든 ooo/<session> 관리 브랜치에서 다른 브랜치를 만들거나 전환하지 않고, 각 실행 슬라이스를 별도 커밋한다."
  - "Flutter 소스는 이 저장소 작업 트리에 없으며 legacy/flutter 브랜치에 보존하고 활성 빌드, 테스트와 배포 대상에서는 제외한다."
  - "Android applicationId는 com.friendshipHyun을 유지하고 iOS Bundle ID는 com.ao.lingua를 사용한다."
  - "Android와 iOS의 UI, 화면 상태, 문장 처리, 검색, CSV 생성과 저장 계약은 common KMP 코드로 공유한다."
  - "지원 문서는 TXT 한 종류이며 마지막 단일 문서를 앱 저장소에 복사하고 콘텐츠 기반 ID로 자동 재개한다."
  - "문장 위치, 검색 결과, 이동과 북마크는 문장 인덱스를 기준으로 한다."
  - "사용자 데이터 reader.db와 읽기 전용 위키낱말사전 SQLite를 분리하고 androidx.sqlite KMP와 BundledSQLiteDriver를 사용한다."
  - "사전 결과가 없을 때만 사용자가 translateProxy 번역을 선택할 수 있으며 앱은 DeepL 키를 저장하거나 전달받지 않는다."
  - "로그인, 회원가입, 계정 복구, 이메일 인증, 클라우드 단어장과 사용자 데이터 동기화를 포함하지 않는다."
  - "Firebase 익명 인증은 원격 번역이 처음 필요할 때 수행하고 오프라인 리더와 사전은 인증이나 네트워크 없이 동작한다."
  - "캐시된 번역은 네트워크 호출과 quota 차감 없이 재사용하고 하단에 잔량과 충전 시간을 표시한다."
  - "Android release는 Play Integrity, iOS release는 App Attest와 DeviceCheck 대체 경로, 개발 빌드는 Debug Provider를 사용한다."
  - "한국어 위키낱말사전 파생 DB와 배포물에 CC BY-SA 4.0 출처와 NOTICE를 포함한다."
  - "App Store와 Google Play 업로드, Android 실기기와 iOS App Attest 실기기 검증은 이번 자동 실행에서 제외하고 출시 관문으로 남긴다."
  - "단일 구현용 인터페이스, 팩토리와 미래 확장용 계층은 만들지 않는다."

acceptance_criteria:
  - description: "TXT 문서 열기, 안정적인 문장 분리, 문장 이동, 자동 재개, 검색, 전체 문장 뷰어, 북마크, 사용자 번역 자동 저장, 표시 설정과 CSV 생성이 공통 문장 인덱스 계약으로 동작한다."
    verify: "./gradlew test"
    artifacts: "NONE"
    expect: "NONE"

  - description: "단어 버튼과 직접 검색이 동일한 읽기 전용 위키낱말사전 SQLite를 조회하고 오프라인 결과와 라이선스 고지를 제공하며 결과가 없을 때만 원격 번역 선택을 노출한다."
    verify: "./gradlew test"
    artifacts: "NONE"
    expect: "NONE"

  - description: "로그인 화면 없이 익명 인증과 App Check가 translateProxy 호출 시점에만 연결되고 캐시, quota 잔량과 충전 시간이 공통 화면 상태에 반영된다."
    verify: "./gradlew test"
    artifacts: "NONE"
    expect: "NONE"

  - description: "Android com.friendshipHyun과 iOS com.ao.lingua 앱이 공통 CMP 리더, 모달, 드로어, 로컬 DB 설치와 플랫폼 파일 선택 계약을 사용하도록 빌드 구성이 완성된다."
    verify: "./gradlew test"
    artifacts: "NONE"
    expect: "NONE"

